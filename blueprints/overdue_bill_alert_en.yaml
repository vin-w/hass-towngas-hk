blueprint:
  name: Towngas Account Overdue Alert (EN)
  description: |
    Sends a notification when a Towngas account balance is over $0 (bill overdue).
    Uses sensor.towngas_hk_{account}_balance to detect overdue status.
  domain: automation
  source_url: https://github.com/vin-w/hass-towngas-hk

  input:
    balance_sensor:
      name: Towngas Balance Sensor
      description: "Select sensor.towngas_hk_{account}_balance"
      selector:
        entity:
          domain: sensor
    notify_service:
      name: Notification Service
      description: "For example: notify.mobile_app_my_phone"
      default: notify.mobile_app_my_phone
      selector:
        text:

trigger:
  - platform: numeric_state
    entity_id: !input balance_sensor
    above: 0

action:
  - variables:
      balance_entity: "{{ trigger.entity_id }}"
      balance_obj_id: "{{ balance_entity.split('.')[1] if balance_entity else '' }}"
      account_no: >-
        {{ balance_obj_id.split('_')[2]
           if balance_obj_id and balance_obj_id.split('_') | length > 2
           else '' }}

      bill_amount_entity: >-
        {{ 'sensor.towngas_hk_' ~ account_no ~ '_bill_amount'
           if account_no else 'sensor.towngas_hk_unknown_bill_amount' }}
      bill_date_entity: >-
        {{ 'sensor.towngas_hk_' ~ account_no ~ '_bill_due_date'
           if account_no else 'sensor.towngas_hk_unknown_bill_due_date' }}

      balance: "{{ states(balance_entity) | float(0) | round(2) }}"
      bill_amount: >-
        {{ (states(bill_amount_entity) | float(0)) | round(2)
           if states(bill_amount_entity) not in ['unknown','unavailable',''] else 0.0 }}
      bill_date: >-
        {{ states(bill_date_entity)
           if states(bill_date_entity) not in ['unknown','unavailable',''] else 'Unknown' }}

  - service: !input notify_service
    data:
      title: "Towngas Bill Overdue!"
      message: |
        Account: {{ account_no or 'Unknown' }}
        Balance: ${{ balance }}
        Bill Amount: ${{ bill_amount }}
        Due Date: {{ bill_date }}

mode: single
max_exceeded: silent
